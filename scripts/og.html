<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image</title>
<style>
@font-face { font-family: "Mona Sans"; src: url("../assets/fonts/MonaSans-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Mona Sans"; src: url("../assets/fonts/MonaSans-700.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Cascadia Mono"; src: url("../assets/fonts/CascadiaMono-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Cascadia Mono"; src: url("../assets/fonts/CascadiaMono-600.woff2") format("woff2"); font-weight: 600; }
:root { --gold: oklch(0.829 0.148 77.2); --green: oklch(0.737 0.146 157.4); --teal: oklch(0.888 0.13 183.5); --sky: oklch(0.783 0.103 243.1); --orange: oklch(0.758 0.151 54.2); --pink: oklch(0.717 0.213 339.4); }
html, body { margin: 0; }
.card {
  position: relative; overflow: hidden; width: 1200px; height: 630px;
  background-color: oklch(0.189 0.089 274.7);
  background-image:
    radial-gradient(900px 600px at 92% -10%, oklch(0.32 0.19 284 / 0.6), transparent 62%),
    linear-gradient(oklch(0.302 0.155 272.1 / 0.32) 1px, transparent 1px),
    linear-gradient(90deg, oklch(0.302 0.155 272.1 / 0.32) 1px, transparent 1px);
  background-size: auto, 80px 80px, 80px 80px;
  color: oklch(0.951 0.019 289.3); font-family: "Mona Sans", sans-serif;
}
.copy { position: absolute; left: 72px; top: 92px; width: 640px; }
.kicker { font: 400 22px/1.3 "Cascadia Mono", monospace; color: oklch(0.809 0.063 286.9); display: flex; align-items: center; gap: 14px; }
.kicker b { font-weight: 600; color: var(--teal); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 14px var(--teal); }
h1 { margin: 30px 0 0; font-size: 96px; line-height: 0.96; font-weight: 700; letter-spacing: -0.035em; }
h1 span { color: var(--gold); }
p { margin: 30px 0 0; font-size: 30px; line-height: 1.4; color: oklch(0.809 0.063 286.9); max-width: 600px; }
.url { position: absolute; left: 72px; bottom: 54px; font: 400 22px/1 "Cascadia Mono", monospace; color: oklch(0.731 0.082 285.8); }
svg { position: absolute; right: -170px; top: -70px; width: 760px; overflow: visible; }
.lane { fill: none; stroke-linecap: round; }
.base { stroke-width: 9; }
.glow { stroke-width: 9; opacity: 0.6; filter: url(#b); }
.thin { stroke-width: 1.5; opacity: 0.75; }
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 640 560">
    <defs><filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs>
    <circle cx="420" cy="250" r="318" fill="none" stroke="oklch(0.342 0.143 276.7)" stroke-width="1" opacity="0.55"/>
    <path class="lane thin" stroke="var(--gold)" d="M150 -20V250A270 270 0 0 0 420 520H700"/>
    <path class="lane glow" stroke="var(--gold)" d="M170 -20V250A250 250 0 0 0 420 500H700"/>
    <path class="lane glow" stroke="var(--green)" d="M196 -20V250A224 224 0 0 0 420 474H700"/>
    <path class="lane glow" stroke="var(--teal)" d="M222 -20V250A198 198 0 0 0 420 448H700"/>
    <path class="lane glow" stroke="var(--sky)" d="M248 -20V250A172 172 0 0 0 420 422H700"/>
    <path class="lane glow" stroke="var(--orange)" d="M274 -20V250A146 146 0 0 0 420 396H700"/>
    <path class="lane glow" stroke="var(--pink)" d="M300 -20V250A120 120 0 0 0 420 370H700"/>
    <path class="lane base" stroke="var(--gold)" d="M170 -20V250A250 250 0 0 0 420 500H700"/>
    <path class="lane base" stroke="var(--green)" d="M196 -20V250A224 224 0 0 0 420 474H700"/>
    <path class="lane base" stroke="var(--teal)" d="M222 -20V250A198 198 0 0 0 420 448H700"/>
    <path class="lane base" stroke="var(--sky)" d="M248 -20V250A172 172 0 0 0 420 422H700"/>
    <path class="lane base" stroke="var(--orange)" d="M274 -20V250A146 146 0 0 0 420 396H700"/>
    <path class="lane base" stroke="var(--pink)" d="M300 -20V250A120 120 0 0 0 420 370H700"/>
  </svg>
  <div class="copy">
    <div class="kicker"><span class="dot"></span><span><b>ignite-2026-gold</b> · the customer playback</span></div>
    <h1>Which Ignite news is <span>yours?</span></h1>
    <p>One prompt. Your own Copilot reads Microsoft's Ignite news and picks what matters for your role and your company.</p>
  </div>
  <div class="url">jw-sthlm.github.io/ignite-2026-gold</div>
</div>
</body>
</html>
